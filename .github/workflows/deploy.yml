name: CI/CD Pipeline for Google Online Boutique

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

env:
  ACR_LOGIN_SERVER: "acrboutiquesemen7037.azurecr.io" # ACR логін сервер
  AZURE_RESOURCE_GROUP: "rg-online-boutique-diploma"
  AKS_CLUSTER_NAME: "aks-online-boutique"
  IMAGE_TAG: ${{ github.sha }} # hash коміту для унікального тегу образу

jobs:
  build-and-push:
    name: Build, Scan & Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.ACR_LOGIN_SERVER }}

      #frontend
      - name: Build Frontend Image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }} ./src/frontend
          
      - name: Run Trivy vulnerability scanner on Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ACR_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1' 
          severity: 'CRITICAL,HIGH'

      - name: Push Frontend Image
        run: docker push ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }}

      

  deploy-to-staging:
    name: Deploy to Staging Namespace
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS Credentials
        run: az aks get-credentials --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER_NAME }}

      - name: Deploy via Helm (Staging)
        run: |
          helm upgrade --install online-boutique ./online-boutique \
            --namespace staging --create-namespace \
            -f ./online-boutique/values-dev.yaml \
            --set frontend.image=${{ env.ACR_LOGIN_SERVER }}/frontend \
            --set frontend.tag=${{ env.IMAGE_TAG }} \
            --wait --timeout 5m